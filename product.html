<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Товар</title>
  <link rel="stylesheet" href="product.css">
</head>
<body>

<header>
  <h1 id="product-name">Товар</h1>
  <button id="theme-toggle">Dark mode</button>
</header>

<main id="product-page">

  <div class="image-section">
    <img id="main-img" src="" alt="main product photo">

    <div class="thumbnails">
      <img class="thumb" src="" alt="">
    </div>
  </div>

  <div class="info-section">
    <h2 id="product-title">Назва товару</h2>
    <p id="product-price" class="price">0 грн</p>

    <p id="product-desc" class="desc">
      Опис товару буде тут...
    </p>

    <div class="buttons">
      <button id="buy-now">Купити зараз</button>
      <button id="add-to-cart">Додати в кошик</button>
    </div>
  </div>

</main>

<script src="product.js"></script>
</body>
</html>
